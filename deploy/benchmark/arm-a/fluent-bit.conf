# Arm A: raw Suricata EVE -> OpenSearch, no Cernity in the path. This is the honest
# "just point Suricata at your SIEM" baseline the benchmark compares Cernity against.
[SERVICE]
    Flush        1
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name   tail
    Path   /eve/eve-alerts.json,/eve/eve-nsm.json
    Tag    arm_a.eve
    Parser json
    Read_from_Head true

[OUTPUT]
    Name    opensearch
    Match   arm_a.*
    Host    opensearch
    Port    9200
    Index   arm-a-suricata
    Suppress_Type_Name On
    tls     Off
