# Cernity NDR transforms. An asset-enrichment lookup keyed on the stable asset_id (CIM
# Asset_And_Identity) so entity-timeline panels can resolve an asset's display name/owner
# without re-querying ClickHouse. The lookup CSV ships empty; a deployment populates it.
[cernity_ndr_assets_lookup]
filename = cernity_ndr_assets.csv
case_sensitive_match = false
