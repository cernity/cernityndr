{{- range .Values.detectors }}
{{- $d := . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $d.name }}
  labels:
    {{- include "cernity.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $d.name }}
spec:
  {{- if not $d.hpa.enabled }}
  replicas: {{ $d.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $d.name }}
  template:
    metadata:
      labels:
        {{- include "cernity.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $d.name }}
    spec:
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ $d.name }}
          image: {{ include "cernity.image" (dict "Values" $.Values "name" $d.name) }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ $.Release.Name }}-cernity-env
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          ports:
            - name: metrics
              containerPort: 9108
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- if $d.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $.Release.Name }}-{{ $d.name }}
  labels:
    {{- include "cernity.labels" $ | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $.Release.Name }}-{{ $d.name }}
  minReplicas: {{ $d.hpa.min }}
  maxReplicas: {{ $d.hpa.max }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $d.hpa.cpu }}
{{- end }}
{{- end }}
