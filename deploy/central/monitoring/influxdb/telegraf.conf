# Telegraf -> InfluxDB 3 Core (plan 011 U6). Scrapes the same Prometheus /metrics the services
# expose, so InfluxDB holds the same families (measurement = family, tags = prom labels) that the
# InfluxBackend's InfluxQL twins query. Bounded interval; a metrics-collection failure never affects
# the pipeline. Create the DB `cernity` and an admin token first (influxdb3 create token --admin).
[agent]
  interval = "15s"
  flush_interval = "15s"
  omit_hostname = false

[[inputs.prometheus]]
  metric_version = 2
  urls = [
    "http://behavioral-detectors-behavioral-detectors-1:9108/metrics",
    "http://behavioral-detectors-behavioral-detectors-2:9108/metrics",
    "http://behavioral-detectors-behavioral-detectors-3:9108/metrics",
    "http://ndr-finding-service:9108/metrics",
    "http://ndr-threat-intel:9108/metrics",
    "http://ndr-coverage-detector:9108/metrics",
    "http://ndr-ids-alerts:9108/metrics",
    "http://ndr-anomaly-detector:9108/metrics",
    "http://ndr-east-west-detectors:9108/metrics",
    "http://ndr-protocol-detectors:9108/metrics",
    "http://ndr-normalizer:9108/metrics"
  ]

[[inputs.prometheus]]
  metric_version = 2
  urls = ["http://redpanda:9644/public_metrics"]

# Host + container metrics for host_cpu/host_mem parity with node_exporter.
[[inputs.cpu]]
  percpu = false
  totalcpu = true
[[inputs.mem]]

[[outputs.influxdb_v2]]
  urls = ["http://influxdb3:8181"]
  token = "${INFLUX_TOKEN}"
  organization = "cernity"
  bucket = "cernity"
