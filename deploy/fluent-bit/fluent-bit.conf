# Cernity edge shipper. Tails Suricata's split EVE files, routes each event to
# its Cernity topic, keys by source IP, and ships to the bus. Runs on the sensor.
# The bus address comes from REDPANDA_BOOTSTRAP (default redpanda:9092).
[SERVICE]
    Flush          1
    Daemon         Off
    Log_Level      ${LOG_LEVEL}
    Parsers_File   parsers.conf

# Signature alerts (Suricata's eve-alerts.json).
[INPUT]
    Name           tail
    Alias          eve_alerts
    Path           ${SURICATA_EVE_ALERTS}
    Parser         eve_json
    Tag            suricata.alerts
    Read_from_Head false
    DB             /var/lib/cernity/fluent-bit-alerts.db

# Network-security-monitoring records (flow, dns, tls, http, ssh, file, anomaly).
[INPUT]
    Name           tail
    Alias          eve_nsm
    Path           ${SURICATA_EVE_NSM}
    Parser         eve_json
    Tag            suricata.nsm
    Read_from_Head false
    DB             /var/lib/cernity/fluent-bit-nsm.db

# Compute topic + partition key from the record.
[FILTER]
    Name   lua
    Match  suricata.*
    script route.lua
    call   route

# Ship to the bus. Dynamic_topic uses the per-record _topic; the key is _pkey.
[OUTPUT]
    Name              kafka
    Match             suricata.*
    Brokers           ${REDPANDA_BOOTSTRAP}
    Topic_Key         _topic
    Dynamic_topic     On
    Topics            suricata.raw.v1
    Message_Key_Field _pkey
    Timestamp_Key     @timestamp
    rdkafka.log.connection.close false
