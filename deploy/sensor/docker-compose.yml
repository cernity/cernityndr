# Cernity sensor-side bundle: the Fluent Bit shipper that tails Suricata's EVE
# logs and ships them to the central bus. Runs ON the sensor (the box already
# running Suricata). Point it at your Suricata log directory and the bus.
#
#   REDPANDA_BOOTSTRAP=<central-bus-host>:9092 \
#   SURICATA_LOG_DIR=/var/log/suricata \
#   docker compose -f deploy/sensor/docker-compose.yml up -d
#
# Configure Suricata's EVE output first — see docs/suricata-config.md.

x-logging: &cernity-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  fluent-bit:
    image: fluent/fluent-bit:latest
    container_name: cernity-fluent-bit
    environment:
      REDPANDA_BOOTSTRAP: ${REDPANDA_BOOTSTRAP:-redpanda:9092}
      SURICATA_EVE_ALERTS: ${SURICATA_EVE_ALERTS:-/var/log/suricata/eve-alerts.json}
      SURICATA_EVE_NSM: ${SURICATA_EVE_NSM:-/var/log/suricata/eve-nsm.json}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Secure bus creds (default). Copy the central host's ca.crt to this host and
      # point CERNITY_BUS_CA at it. For an insecure-demo bus, remove the SASL lines
      # from deploy/fluent-bit/fluent-bit.conf instead.
      CERNITY_BUS_USER: ${CERNITY_BUS_USER:-cernity-sensor}
      CERNITY_BUS_PASSWORD: ${CERNITY_BUS_PASSWORD:-}
      CERNITY_BUS_TLS_CA: /certs/ca.crt
    volumes:
      # the shipper config
      - ../fluent-bit:/fluent-bit/etc:ro
      # the CA that signed the bus's server cert (copied from the central host)
      - ${CERNITY_BUS_CA:-./ca.crt}:/certs/ca.crt:ro
      # your Suricata log directory (read-only)
      - ${SURICATA_LOG_DIR:-/var/log/suricata}:/var/log/suricata:ro
      # shipper offset state, so a restart resumes where it left off
      - cernity-fluentbit-state:/var/lib/cernity
    command: ["/fluent-bit/bin/fluent-bit", "-c", "/fluent-bit/etc/fluent-bit.conf"]
    logging: *cernity-logging
    restart: unless-stopped

  # Optional: on-demand packet forensics. Enable with `--profile capture`.
  # Self-arms over the bus (no inbound access), actuates the local Suricata's
  # conditional PCAP, and ships bounded PCAPs to the central object store.
  capture-agent:
    image: cernity/capture-agent:latest
    build: {context: ../.., dockerfile: services/capture-agent/Dockerfile}
    container_name: cernity-capture-agent
    profiles: [capture]
    environment:
      REDPANDA_BOOTSTRAP: ${REDPANDA_BOOTSTRAP:-redpanda:9092}
      SENSOR_ID: ${NDR_SENSOR:-sensor-1}
      SURICATA_SOCKET: /var/run/suricata/suricata-command.socket
      PCAP_DIR: /var/log/suricata/ndr-capture
      RING_DIR: /var/log/suricata/ndr-ring
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-cernity}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-cernitydemo}
      PCAP_BUCKET: ndr-pcap
      FILES_BUCKET: ndr-files
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # Suricata's command socket + pcap output dir (read-write for capture)
      - ${SURICATA_RUN_DIR:-/var/run/suricata}:/var/run/suricata
      - ${SURICATA_LOG_DIR:-/var/log/suricata}:/var/log/suricata
    logging: *cernity-logging
    restart: unless-stopped

volumes:
  cernity-fluentbit-state: {}
