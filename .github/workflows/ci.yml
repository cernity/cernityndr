name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install kafka-python-ng jsonschema prometheus_client lz4 redis
      - name: Run unit test gate
        run: ./run-tests.sh

  # The full Docker end-to-end (builds every image, boots the stack, feeds a
  # beacon) is heavy and timing-sensitive, so it runs on demand rather than on
  # every push. Trigger it from the Actions tab ("Run workflow").
  e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Fresh-install e2e, both bus postures (F09):
      # 1) DEFAULT quickstart from a clean checkout — a replayed beacon must surface as a
      #    finding in the sink (proves the whole pipeline starts and delivers).
      - name: Fresh-install e2e — default quickstart (Docker)
        run: python tests/test_e2e_skeleton.py
      # 2) SECURE bus from a clean checkout — the produce-only sensor credential is refused
      #    forging findings while the central pipeline works (F02/F09 acceptance).
      - name: Fresh-install e2e — secure bus ACLs (Docker)
        run: ./deploy/security/test_bus_acls.sh
