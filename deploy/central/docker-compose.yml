# Cernity central core. All tunables come from the repo-root .env file
# (copy cernity.env.example -> .env); the defaults below apply if a value is unset.
# Run from the repo root so Compose auto-loads .env:
#   docker compose -f deploy/central/docker-compose.yml up --build

# Cap every container's logs so they can never fill the disk (rotated, ~30 MB max).
x-logging: &cernity-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Common environment shared by the detector services.
x-detector-env: &detector-env
  REDPANDA_BOOTSTRAP: ${REDPANDA_BOOTSTRAP:-redpanda:9092}
  NDR_STATE_BACKEND: ${NDR_STATE_BACKEND:-memory}
  NDR_TENANT: ${NDR_TENANT:-default}
  NDR_SENSOR: ${NDR_SENSOR:-sensor-1}
  WINDOW_SECS: ${WINDOW_SECS:-600}
  EVAL_SECS: ${EVAL_SECS:-30}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  HEARTBEAT_SECS: ${HEARTBEAT_SECS:-300}

services:
  redpanda:
    image: redpandadata/redpanda:latest
    container_name: cernity-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      # Two listeners: internal (containers reach redpanda:9092 on the docker network)
      # and external (a remote Suricata sensor reaches CENTRAL_HOST:19092). Set
      # CERNITY_ADVERTISE_HOST in .env to this host's reachable IP/DNS so the external
      # advertised address resolves for the sensor.
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://${CERNITY_ADVERTISE_HOST:-127.0.0.1}:19092
    ports:
      - "19092:19092"        # external Kafka listener for remote sensor shippers
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *cernity-logging
    restart: unless-stopped

  ids-alerts:
    image: cernity/ids-alerts:latest
    build: {context: ../.., dockerfile: services/ids-alerts/Dockerfile}
    container_name: cernity-ids-alerts
    environment: *detector-env
    depends_on: {redpanda: {condition: service_healthy}}
    logging: *cernity-logging
    restart: unless-stopped

  behavioral-detectors:
    image: cernity/behavioral-detectors:latest
    build: {context: ../.., dockerfile: services/behavioral-detectors/Dockerfile}
    container_name: cernity-behavioral-detectors
    environment: *detector-env
    depends_on: {redpanda: {condition: service_healthy}}
    logging: *cernity-logging
    restart: unless-stopped

  dns-detector:
    image: cernity/dns-detector:latest
    build: {context: ../.., dockerfile: services/dns-detector/Dockerfile}
    container_name: cernity-dns-detector
    environment: *detector-env
    depends_on: {redpanda: {condition: service_healthy}}
    logging: *cernity-logging
    restart: unless-stopped

  http-detector:
    image: cernity/http-detector:latest
    build: {context: ../.., dockerfile: services/http-detector/Dockerfile}
    container_name: cernity-http-detector
    environment: *detector-env
    depends_on: {redpanda: {condition: service_healthy}}
    logging: *cernity-logging
    restart: unless-stopped

  protocol-detectors:
    image: cernity/protocol-detectors:latest
    build: {context: ../.., dockerfile: services/protocol-detectors/Dockerfile}
    container_name: cernity-protocol-detectors
    environment: *detector-env
    depends_on: {redpanda: {condition: service_healthy}}
    logging: *cernity-logging
    restart: unless-stopped

  east-west-detectors:
    image: cernity/east-west-detectors:latest
    build: {context: ../.., dockerfile: services/east-west-detectors/Dockerfile}
    container_name: cernity-east-west-detectors
    environment: *detector-env
    depends_on: {redpanda: {condition: service_healthy}}
    logging: *cernity-logging
    restart: unless-stopped

  anomaly-detector:
    image: cernity/anomaly-detector:latest
    build: {context: ../.., dockerfile: services/anomaly-detector/Dockerfile}
    container_name: cernity-anomaly-detector
    environment: *detector-env
    depends_on: {redpanda: {condition: service_healthy}}
    logging: *cernity-logging
    restart: unless-stopped

  coverage-detector:
    image: cernity/coverage-detector:latest
    build: {context: ../.., dockerfile: services/coverage-detector/Dockerfile}
    container_name: cernity-coverage-detector
    environment: *detector-env
    depends_on: {redpanda: {condition: service_healthy}}
    logging: *cernity-logging
    restart: unless-stopped

  threat-intel:
    image: cernity/threat-intel:latest
    build: {context: ../.., dockerfile: services/threat-intel/Dockerfile}
    container_name: cernity-threat-intel
    environment: *detector-env
    depends_on: {redpanda: {condition: service_healthy}}
    logging: *cernity-logging
    restart: unless-stopped

  finding-service:
    image: cernity/finding-service:latest
    build: {context: ../.., dockerfile: services/finding-service/Dockerfile}
    container_name: cernity-finding-service
    environment:
      REDPANDA_BOOTSTRAP: ${REDPANDA_BOOTSTRAP:-redpanda:9092}
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-ndr}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on: {redpanda: {condition: service_healthy}}
    logging: *cernity-logging
    restart: unless-stopped

  findings-forwarder:
    image: cernity/findings-forwarder:latest
    build: {context: ../.., dockerfile: services/findings-forwarder/Dockerfile}
    container_name: cernity-findings-forwarder
    environment:
      REDPANDA_BOOTSTRAP: ${REDPANDA_BOOTSTRAP:-redpanda:9092}
      CERNITY_SINK: ${CERNITY_SINK:-file}
      CERNITY_SINK_FILE: ${CERNITY_SINK_FILE:-/out/findings.jsonl}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - cernity-out:/out
    depends_on: {redpanda: {condition: service_healthy}}
    logging: *cernity-logging
    restart: unless-stopped

volumes:
  cernity-out: {}
