name: publish

# Build and push multi-arch service images to Docker Hub. Runs on version tags
# (a release) or manually from the Actions tab — not on every push, so it never
# fails noisily before the Docker Hub secrets are set.
# Requires two repository secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - ids-alerts
          - behavioral-detectors
          - dns-detector
          - http-detector
          - protocol-detectors
          - east-west-detectors
          - anomaly-detector
          - coverage-detector
          - threat-intel
          - finding-service
          - findings-forwarder
          - normalizer
          - asset-service
          - correlation-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }} (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: cernity/${{ matrix.service }}:latest
