# Cernity central core. All tunables come from the repo-root .env file
# (copy cernity.env.example -> .env); the defaults below apply if a value is unset.
# Run from the repo root so Compose auto-loads .env:
#   docker compose -f deploy/central/docker-compose.yml up --build

# Cap every container's logs so they can never fill the disk (rotated, ~30 MB max).
x-logging: &cernity-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Central pipeline bus credential (F02). Central services authenticate to the internal
# SASL listener as the trusted 'central' principal (a superuser on the private docker
# net); with no CA this is SASL over plaintext. This is a DIFFERENT credential from the
# produce-only sensor one distributed to remote sensors — a compromised sensor can
# never present the central credential. In the fully-insecure demo posture
# (CERNITY_INSECURE_BUS=1) set CERNITY_BUS_CENTRAL_MECHANISM= (empty) so clients skip SASL.
x-central-bus-auth: &central-bus-auth
  NDR_BUS_SASL_MECHANISM: ${CERNITY_BUS_CENTRAL_MECHANISM-SCRAM-SHA-512}
  NDR_BUS_SASL_USER: ${CERNITY_BUS_CENTRAL_USER:-cernity-central}
  NDR_BUS_SASL_PASSWORD: ${CERNITY_BUS_CENTRAL_PASSWORD:-}

# Common environment shared by the detector services.
x-detector-env: &detector-env
  <<: *central-bus-auth
  REDPANDA_BOOTSTRAP: ${REDPANDA_BOOTSTRAP:-redpanda:9092}
  NDR_STATE_BACKEND: ${NDR_STATE_BACKEND:-memory}
  NDR_TENANT: ${NDR_TENANT:-default}
  NDR_SENSOR: ${NDR_SENSOR:-sensor-1}
  WINDOW_SECS: ${WINDOW_SECS:-600}
  EVAL_SECS: ${EVAL_SECS:-30}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  HEARTBEAT_SECS: ${HEARTBEAT_SECS:-300}

# Tiered container hardening. Cernity's own (python) services drop all caps, gain
# no-new-privileges, and run read-only with a tmpfs /tmp. Infra (redpanda/redis/
# clickhouse/minio/opensearch/etc.) gets no-new-privileges but stays writable.
x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  read_only: true
  tmpfs: ["/tmp"]
x-hardening-infra: &hardening-infra
  security_opt: ["no-new-privileges:true"]

services:
  redpanda:
    image: redpandadata/redpanda:latest
    container_name: cernity-redpanda
    <<: *hardening-infra
    # Two listeners: internal (containers reach redpanda:9092 on the docker network,
    # plaintext) and external (a remote sensor reaches CENTRAL_HOST:19092). By default
    # the external listener is SASL/SCRAM-SHA-512 + TLS; the entrypoint selects secure
    # vs the CERNITY_INSECURE_BUS=1 plaintext demo posture. Generate certs + a SCRAM
    # credential with deploy/security/gen-bus-certs.sh and set CERNITY_BUS_USER/PASSWORD.
    entrypoint: ["/entrypoint.sh"]
    environment:
      CERNITY_ADVERTISE_HOST: ${CERNITY_ADVERTISE_HOST:-127.0.0.1}
      CERNITY_INSECURE_BUS: ${CERNITY_INSECURE_BUS:-0}
      # Produce-only sensor credential (distributed to sensors) + the central-only
      # pipeline and bootstrap-admin credentials. The entrypoint seeds all three and
      # their ACLs, then enables authorization (F02). The sensor is never a superuser.
      CERNITY_BUS_USER: ${CERNITY_BUS_USER:-cernity-sensor}
      CERNITY_BUS_PASSWORD: ${CERNITY_BUS_PASSWORD:-}
      CERNITY_BUS_CENTRAL_USER: ${CERNITY_BUS_CENTRAL_USER:-cernity-central}
      CERNITY_BUS_CENTRAL_PASSWORD: ${CERNITY_BUS_CENTRAL_PASSWORD:-}
      CERNITY_BUS_ADMIN_USER: ${CERNITY_BUS_ADMIN_USER:-cernity-admin}
      CERNITY_BUS_ADMIN_PASSWORD: ${CERNITY_BUS_ADMIN_PASSWORD:-}
    volumes:
      # Named data volume (F14): the broker's log/offsets survive a container recreate, so
      # in-flight findings/offsets are not lost on redeploy (stable down/up reattachment).
      - cernity-redpanda-data:/var/lib/redpanda/data
      - ./redpanda/entrypoint.sh:/entrypoint.sh:ro
      - ./redpanda/redpanda.yaml.tmpl:/etc/redpanda/redpanda.yaml.tmpl:ro
      - ../security/secrets:/certs:ro
    ports:
      - "19092:19092"        # external Kafka listener for remote sensor shippers
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *cernity-logging
    restart: unless-stopped

  ids-alerts:
    image: cernity/ids-alerts:latest
    build: {context: ../.., dockerfile: services/ids-alerts/Dockerfile}
    container_name: cernity-ids-alerts
    <<: *hardening
    environment: *detector-env
    depends_on: {redpanda: {condition: service_healthy}}
    logging: *cernity-logging
    restart: unless-stopped

  behavioral-detectors:
    image: cernity/behavioral-detectors:latest
    build: {context: ../.., dockerfile: services/behavioral-detectors/Dockerfile}
    container_name: cernity-behavioral-detectors
    <<: *hardening
    environment: *detector-env
    depends_on: {redpanda: {condition: service_healthy}}
    logging: *cernity-logging
    restart: unless-stopped

  dns-detector:
    image: cernity/dns-detector:latest
    build: {context: ../.., dockerfile: services/dns-detector/Dockerfile}
    container_name: cernity-dns-detector
    <<: *hardening
    environment: *detector-env
    depends_on: {redpanda: {condition: service_healthy}}
    logging: *cernity-logging
    restart: unless-stopped

  http-detector:
    image: cernity/http-detector:latest
    build: {context: ../.., dockerfile: services/http-detector/Dockerfile}
    container_name: cernity-http-detector
    <<: *hardening
    environment: *detector-env
    depends_on: {redpanda: {condition: service_healthy}}
    logging: *cernity-logging
    restart: unless-stopped

  protocol-detectors:
    image: cernity/protocol-detectors:latest
    build: {context: ../.., dockerfile: services/protocol-detectors/Dockerfile}
    container_name: cernity-protocol-detectors
    <<: *hardening
    environment: *detector-env
    depends_on: {redpanda: {condition: service_healthy}}
    logging: *cernity-logging
    restart: unless-stopped

  east-west-detectors:
    image: cernity/east-west-detectors:latest
    build: {context: ../.., dockerfile: services/east-west-detectors/Dockerfile}
    container_name: cernity-east-west-detectors
    <<: *hardening
    environment: *detector-env
    depends_on: {redpanda: {condition: service_healthy}}
    logging: *cernity-logging
    restart: unless-stopped

  anomaly-detector:
    image: cernity/anomaly-detector:latest
    build: {context: ../.., dockerfile: services/anomaly-detector/Dockerfile}
    container_name: cernity-anomaly-detector
    <<: *hardening
    environment: *detector-env
    depends_on: {redpanda: {condition: service_healthy}}
    logging: *cernity-logging
    restart: unless-stopped

  coverage-detector:
    image: cernity/coverage-detector:latest
    build: {context: ../.., dockerfile: services/coverage-detector/Dockerfile}
    container_name: cernity-coverage-detector
    <<: *hardening
    environment: *detector-env
    depends_on: {redpanda: {condition: service_healthy}}
    logging: *cernity-logging
    restart: unless-stopped

  threat-intel:
    image: cernity/threat-intel:latest
    build: {context: ../.., dockerfile: services/threat-intel/Dockerfile}
    container_name: cernity-threat-intel
    <<: *hardening
    environment: *detector-env
    depends_on: {redpanda: {condition: service_healthy}}
    logging: *cernity-logging
    restart: unless-stopped

  finding-service:
    image: cernity/finding-service:latest
    build: {context: ../.., dockerfile: services/finding-service/Dockerfile}
    container_name: cernity-finding-service
    <<: *hardening
    environment:
      <<: *central-bus-auth
      REDPANDA_BOOTSTRAP: ${REDPANDA_BOOTSTRAP:-redpanda:9092}
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-ndr}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      # F04: Tier-2 enrichment is opt-in via these toggles/keys — pass them through so
      # setting them in .env reaches finding-service. F01 finalization timeout too.
      NDR_ENRICH_TIMEOUT_SECS: ${NDR_ENRICH_TIMEOUT_SECS:-120}
      INTEL_RDNS: ${INTEL_RDNS:-}
      INTEL_RDAP: ${INTEL_RDAP:-}
      GREYNOISE_API_KEY: ${GREYNOISE_API_KEY:-}
      INTEL_HTTP_TIMEOUT: ${INTEL_HTTP_TIMEOUT:-3}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on: {redpanda: {condition: service_healthy}}
    logging: *cernity-logging
    restart: unless-stopped

  findings-forwarder:
    image: cernity/findings-forwarder:latest
    build: {context: ../.., dockerfile: services/findings-forwarder/Dockerfile}
    container_name: cernity-findings-forwarder
    <<: *hardening
    environment:
      <<: *central-bus-auth
      REDPANDA_BOOTSTRAP: ${REDPANDA_BOOTSTRAP:-redpanda:9092}
      CERNITY_SINK: ${CERNITY_SINK:-file}
      CERNITY_SINK_FILE: ${CERNITY_SINK_FILE:-/out/findings.jsonl}
      CERNITY_SINK_FILE_MAX_BYTES: ${CERNITY_SINK_FILE_MAX_BYTES:-104857600}
      CERNITY_DLQ_DIR: ${CERNITY_DLQ_DIR:-/out/dlq}
      # F04: pass the selected SIEM sink's credentials through to the container, so setting
      # any of these in .env actually reaches findings-forwarder and delivers. Unset ->
      # empty; each adapter only reads the vars for the CERNITY_SINK(s) you selected.
      ES_ENDPOINT: ${ES_ENDPOINT:-}
      ES_USER: ${ES_USER:-}
      ES_PASSWORD: ${ES_PASSWORD:-}
      ES_INDEX_PREFIX: ${ES_INDEX_PREFIX:-ndr-findings}
      ES_TLS_VERIFY: ${ES_TLS_VERIFY:-true}
      SPLUNK_HEC_URL: ${SPLUNK_HEC_URL:-}
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN:-}
      SPLUNK_SOURCETYPE: ${SPLUNK_SOURCETYPE:-cernity:finding}
      SPLUNK_TLS_VERIFY: ${SPLUNK_TLS_VERIFY:-true}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_AUTH: ${WEBHOOK_AUTH:-}
      WEBHOOK_TLS_VERIFY: ${WEBHOOK_TLS_VERIFY:-true}
      SYSLOG_HOST: ${SYSLOG_HOST:-}
      SYSLOG_PORT: ${SYSLOG_PORT:-514}
      SYSLOG_TLS: ${SYSLOG_TLS:-false}
      DEVO_TRANSPORT: ${DEVO_TRANSPORT:-syslog}
      DEVO_FORMAT: ${DEVO_FORMAT:-json}
      DEVO_TAG: ${DEVO_TAG:-my.app.cernity.findings}
      DEVO_RELAY: ${DEVO_RELAY:-}
      DEVO_PORT: ${DEVO_PORT:-443}
      DEVO_CERT: ${DEVO_CERT:-}
      DEVO_KEY: ${DEVO_KEY:-}
      DEVO_CHAIN: ${DEVO_CHAIN:-}
      DEVO_ENDPOINT: ${DEVO_ENDPOINT:-}
      DEVO_TOKEN: ${DEVO_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - cernity-out:/out
    depends_on: {redpanda: {condition: service_healthy}}
    logging: *cernity-logging
    restart: unless-stopped

volumes:
  cernity-out: {}
  cernity-redpanda-data: {}      # F14: durable broker state across container recreate
