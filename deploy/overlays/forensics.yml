# Packet-forensics + file-inspection overlay: on-demand PCAP capture, central Zeek
# enrichment, and carved-file hash/YARA scanning. Adds MinIO (object store) for
# PCAPs and carved files.
#
#   docker compose -f deploy/central/docker-compose.yml \
#                  -f deploy/overlays/forensics.yml up --build
#
# The sensor-side cernity-capture-agent (deploy/sensor, capture profile) actuates
# the actual PCAP; this overlay is the central half of that loop.
# Set MINIO_ROOT_USER / MINIO_ROOT_PASSWORD in .env for anything real.

# Executable ACL provisioning is checked against this declaration by the clone gate.
# capture-request.v2 is the schema name; its wire topic is ndr.capture.request.v2.
x-forensics:
  principal: ${CERNITY_BUS_CAPTURE_USER:-cernity-capture}
  sensor_endpoint: ${CERNITY_CAPTURE_S3_ENDPOINT:?set sensor-routable S3 URL}
  acls:
    - {resource: topic, name: ndr.capture.request.v1, pattern: literal, operations: [describe]}
    - {resource: topic, name: ndr.capture.arm.v1, pattern: literal, operations: [read, describe]}
    - {resource: topic, name: ndr.capture.status.v1, pattern: literal, operations: [write, describe]}
    - {resource: topic, name: ndr.capture.request.v2, pattern: literal, operations: [read, describe]}
    - {resource: group, name: 'ndr-capture-agent-${NDR_SENSOR:-sensor-1}', pattern: literal, operations: [read]}

x-logging: &cernity-logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

x-minio-creds: &minio-creds
  MINIO_ENDPOINT: http://minio:9000
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MinIO admin user}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MinIO admin password}

# Central bus credential (F02) — anchors are file-scoped, so this overlay re-declares the same
# central principal the base compose uses. Every bus-connected service here needs it; without it
# these services could not authenticate to a secured (SASL/SCRAM) broker. Empty password in the
# insecure demo (CERNITY_INSECURE_BUS=1 sets CERNITY_BUS_CENTRAL_MECHANISM= so clients skip SASL).
x-central-bus-auth: &central-bus-auth
  NDR_BUS_SASL_MECHANISM: ${CERNITY_BUS_CENTRAL_MECHANISM-SCRAM-SHA-512}
  NDR_BUS_SASL_USER: ${CERNITY_BUS_CENTRAL_USER:-cernity-central}
  NDR_BUS_SASL_PASSWORD: ${CERNITY_BUS_CENTRAL_PASSWORD:-}

# Tiered container hardening. Cernity's own (python) services drop all caps, gain
# no-new-privileges, and run read-only with a tmpfs /tmp. Infra (redpanda/redis/
# clickhouse/minio/opensearch/etc.) gets no-new-privileges but stays writable.
x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  read_only: true
  tmpfs: ["/tmp"]
x-hardening-infra: &hardening-infra
  security_opt: ["no-new-privileges:true"]

services:
  redpanda:
    environment:
      CERNITY_CAPTURE_ENABLED: "1"

  minio:
    image: minio/minio:latest
    container_name: cernity-minio
    <<: *hardening-infra
    command: server /data --console-address ":9001"
    # Bind only to the private/VPN interface used by sensors. Console stays private.
    ports:
      - "${CERNITY_CAPTURE_S3_BIND_IP:?set private central interface}:9000:9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MinIO admin user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MinIO admin password}
    volumes: [cernity-minio:/data]
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *cernity-logging
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: cernity-minio-init
    <<: *hardening-infra
    depends_on: {minio: {condition: service_healthy}}
    entrypoint:
      - sh
      - -ec
      - |
        until mc alias set ndr http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done
        mc mb -p ndr/ndr-raw ndr/ndr-pcap ndr/ndr-files
        mc ilm rule add ndr/ndr-raw --expire-days 14 || true
        mc ilm rule add ndr/ndr-pcap --expire-days 7 || true
        mc ilm rule add ndr/ndr-files --expire-days 7 || true
        # Dedicated sensor key is scoped to its tenant namespace, never MinIO root.
        case "$$CAPTURE_OBJECT_PREFIX" in ''|*[!a-zA-Z0-9._-]*) exit 1;; esac
        case "$$CAPTURE_S3_USER" in ''|*[!a-zA-Z0-9._-]*) exit 1;; esac
        [ "$$CAPTURE_S3_USER" != "$$MINIO_ROOT_USER" ] || exit 1
        printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:PutObject","s3:GetObject"],"Resource":["arn:aws:s3:::ndr-pcap/%s/*"]}]}' "$$CAPTURE_OBJECT_PREFIX" > /tmp/capture-policy.json
        mc admin user add ndr "$$CAPTURE_S3_USER" "$$CAPTURE_S3_PASSWORD"
        mc admin policy create ndr "$$CAPTURE_S3_USER" /tmp/capture-policy.json
        mc admin policy attach ndr "$$CAPTURE_S3_USER" --user "$$CAPTURE_S3_USER"
        mc ls ndr
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MinIO admin user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MinIO admin password}
      CAPTURE_S3_USER: ${CERNITY_MINIO_CAPTURE_USER:?set scoped S3 access key}
      CAPTURE_S3_PASSWORD: ${CERNITY_MINIO_CAPTURE_PASSWORD:?set scoped S3 secret}
      CAPTURE_OBJECT_PREFIX: ${CERNITY_CAPTURE_OBJECT_PREFIX:?set exact tenant_segment}
    restart: "no"

  capture-orchestrator:
    image: cernity/capture-orchestrator:latest
    build: {context: ../.., dockerfile: services/capture-orchestrator/Dockerfile}
    container_name: cernity-capture-orchestrator
    <<: *hardening
    environment:
      <<: *central-bus-auth
      REDPANDA_BOOTSTRAP: ${REDPANDA_BOOTSTRAP:-redpanda:9092}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on: {redpanda: {condition: service_healthy}}
    logging: *cernity-logging
    restart: unless-stopped

  zeek-central:
    image: cernity/zeek-central:latest
    build: {context: ../.., dockerfile: services/zeek-central/Dockerfile}
    container_name: cernity-zeek-central
    <<: *hardening
    environment:
      <<: [*minio-creds, *central-bus-auth]
      REDPANDA_BOOTSTRAP: ${REDPANDA_BOOTSTRAP:-redpanda:9092}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      redpanda: {condition: service_healthy}
      minio: {condition: service_healthy}
    logging: *cernity-logging
    restart: unless-stopped

  zeek-notice:
    image: cernity/zeek-notice:latest
    build: {context: ../.., dockerfile: services/zeek-notice/Dockerfile}
    container_name: cernity-zeek-notice
    <<: *hardening
    environment:
      <<: *central-bus-auth
      REDPANDA_BOOTSTRAP: ${REDPANDA_BOOTSTRAP:-redpanda:9092}
      NDR_TENANT: ${NDR_TENANT:-default}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on: {redpanda: {condition: service_healthy}}
    logging: *cernity-logging
    restart: unless-stopped

  file-threat:
    image: cernity/file-threat:latest
    build: {context: ../.., dockerfile: services/file-threat/Dockerfile}
    container_name: cernity-file-threat
    <<: *hardening
    environment:
      <<: *central-bus-auth
      REDPANDA_BOOTSTRAP: ${REDPANDA_BOOTSTRAP:-redpanda:9092}
      NDR_TENANT: ${NDR_TENANT:-default}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on: {redpanda: {condition: service_healthy}}
    logging: *cernity-logging
    restart: unless-stopped

  file-yara:
    image: cernity/file-yara:latest
    build: {context: ../.., dockerfile: services/file-yara/Dockerfile}
    container_name: cernity-file-yara
    <<: *hardening
    environment:
      <<: [*minio-creds, *central-bus-auth]
      REDPANDA_BOOTSTRAP: ${REDPANDA_BOOTSTRAP:-redpanda:9092}
      NDR_TENANT: ${NDR_TENANT:-default}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      YARA_REGISTRY_DB: /var/lib/file-yara/registry.db
    # Persistent ruleset registry (promotions, drafts, retirements) under the
    # read-only root fs. The image chowns this dir to nobody, so the fresh volume
    # is writable by the service user.
    volumes: [cernity-yara-registry:/var/lib/file-yara]
    depends_on:
      redpanda: {condition: service_healthy}
      minio: {condition: service_healthy}
    logging: *cernity-logging
    restart: unless-stopped

volumes:
  cernity-minio: {}
  cernity-yara-registry: {}
