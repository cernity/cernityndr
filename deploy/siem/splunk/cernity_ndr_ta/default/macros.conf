# Search macros shared by the Cernity NDR dashboards and saved searches. Keeping the index and the
# evidence link templates in macros means a drilldown only ever names a stable siem_pivot field, and a
# deployer retargets the evidence gateway by editing ONE macro (cernity_evidence_base), mirroring
# MANIFEST.json evidence.base_url.
[cernity_ndr_findings]
definition = index=ndr_findings sourcetype=cernity:ndr:finding
iseval = 0

# The analyst-facing evidence/object-store gateway. Placeholder .invalid so an unconfigured deploy
# fails loudly; the deployer edits this one line (and/or sets MANIFEST.json evidence.base_url).
[cernity_evidence_base]
definition = "https://evidence.example.invalid"
iseval = 1

# Captured-packet object link (the vendor_pcap_evidence_id pivot). Returns an eval expression that
# URL-encodes the id (urlencode) onto the configured base. Callers guard null (see the evidence
# dashboard: isnull -> "" so a null id renders no link).
[cernity_ndr_pcap_link(1)]
args = pcap
definition = `cernity_evidence_base` . "/pcap/" . urlencode($pcap$)
iseval = 1

# Extracted-file artifact link (vendor_file_artifact_id — Track A / U9; null until then, guarded by
# the caller the same way).
[cernity_ndr_file_link(1)]
args = fa
definition = `cernity_evidence_base` . "/file/" . urlencode($fa$)
iseval = 1
