# Benchmark stack: run one PCAP through Suricata->SIEM (Arm A), Suricata->Cernity->SIEM
# (Arm B), and Zeek (reference), all into one OpenSearch, for a side-by-side comparison.
# Orchestrated by benchmarks/run.py (it sequences: run engines offline, then ship, then
# score). Infra only — validated by the smoke run, not unit tests.
#
#   BENCH_PCAP=/abs/path/to/scenario.pcap python benchmarks/run.py <scenario>
#
# Arm B reuses the full Cernity central stack:
include:
  - ../central/docker-compose.yml

x-logging: &cernity-logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

# Tiered container hardening. Cernity's own (python) services drop all caps, gain
# no-new-privileges, and run read-only with a tmpfs /tmp. Infra (redpanda/redis/
# clickhouse/minio/opensearch/etc.) gets no-new-privileges but stays writable.
x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  read_only: true
  tmpfs: ["/tmp"]
x-hardening-infra: &hardening-infra
  security_opt: ["no-new-privileges:true"]

services:
  # Shared SIEM for BOTH arms (single node, security disabled — test only).
  opensearch:
    image: opensearchproject/opensearch:latest
    <<: *hardening-infra
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=Bench_only_1
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits: {memlock: {soft: -1, hard: -1}}
    ports: ["9200:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging: *cernity-logging

  # OpenSearch Dashboards for the paired SIEM views (M3/§10). Loopback-bound (§3); the numerical
  # claims come from the exporter (out/<scenario>/output/*.jsonl), this is the human view layer.
  dashboards:
    image: opensearchproject/opensearch-dashboards:latest
    <<: *hardening-infra
    environment:
      - 'OPENSEARCH_HOSTS=["http://opensearch:9200"]'
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports: ["127.0.0.1:5601:5601"]
    depends_on:
      opensearch: {condition: service_healthy}
    restart: "no"
    logging: *cernity-logging

  # Offline Suricata over the PCAP -> split EVE on a shared volume (both arms read it).
  suricata-offline:
    image: jasonish/suricata:latest
    <<: *hardening-infra
    entrypoint: ["suricata", "-c", "/etc/suricata/suricata.yaml",
                 "-r", "${BENCH_PCAP:-/pcaps/scenario.pcap}", "-l", "/eve", "-v"]
    volumes:
      - ./suricata/suricata.yaml:/etc/suricata/suricata.yaml:ro
      - ${BENCH_PCAP_DIR:-./pcaps}:/pcaps:ro
      - cernity-bench-eve:/eve
    restart: "no"
    logging: *cernity-logging

  # Offline Zeek over the SAME PCAP -> JSON logs (reference arm).
  zeek-offline:
    image: zeek/zeek:latest
    <<: *hardening-infra
    entrypoint: ["sh", "-c",
                 "cd /zeek-logs && zeek -r ${BENCH_PCAP:-/pcaps/scenario.pcap} -C /etc/zeek/local.zeek"]
    volumes:
      - ./zeek/local.zeek:/etc/zeek/local.zeek:ro
      - ${BENCH_PCAP_DIR:-./pcaps}:/pcaps:ro
      - cernity-bench-zeek:/zeek-logs
    restart: "no"
    logging: *cernity-logging

  # Arm A: raw Suricata EVE -> OpenSearch (index prefix arm-a). Fluent Bit tails the
  # EVE the offline run produced; no Cernity in this path.
  arm-a-shipper:
    image: fluent/fluent-bit:latest
    <<: *hardening-infra
    volumes:
      - ./arm-a/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - cernity-bench-eve:/eve:ro
    depends_on:
      opensearch: {condition: service_healthy}
    restart: "no"
    logging: *cernity-logging

  # Arm C: Zeek notice.log -> OpenSearch (index arm-c-zeek). Reference arm; ships the
  # notices the offline Zeek run produced. Empty (zero notices) is a valid result.
  zeek-shipper:
    image: fluent/fluent-bit:latest
    <<: *hardening-infra
    volumes:
      - ./zeek/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - cernity-bench-zeek:/zeek-logs:ro
    depends_on:
      opensearch: {condition: service_healthy}
    restart: "no"
    logging: *cernity-logging

  # Arm B: the SAME EVE -> Cernity bus (feeder), so the central stack (from the include)
  # turns it into findings; findings-forwarder is pointed at this OpenSearch below.
  arm-b-feeder:
    image: python:3.12-slim
    <<: *hardening-infra
    working_dir: /feeder
    entrypoint: ["sh", "-c", "pip install --no-cache-dir kafka-python-ng >/dev/null && sleep 8 && python feeder.py /eve/eve-alerts.json && python feeder.py /eve/eve-nsm.json"]
    environment:
      REDPANDA_BOOTSTRAP: ${REDPANDA_BOOTSTRAP:-redpanda:9092}
      # Paced replay by default (§5): honour the pcap's recorded inter-arrival timing instead
      # of bursting, so event-time and processing-clock stay aligned. Set CERNITY_FEED_PACED=0
      # for a fast burst smoke. Scenarios use a compressed real timespan so paced runs stay short.
      # CERNITY_FEED_MAX_GAP is UNSET by default (true timing); setting it is a labelled idle-gap
      # compression that is NOT timing-equivalent.
      CERNITY_FEED_PACED: ${CERNITY_FEED_PACED-1}
      CERNITY_FEED_MAX_GAP: ${CERNITY_FEED_MAX_GAP-}
      # Authenticate as the produce-only SENSOR principal when the bus is secured. The
      # shared CERNITY_BUS_CENTRAL_MECHANISM toggle (empty in the insecure recipe) turns
      # SASL off for the feeder too; a secure run leaves it unset -> SCRAM-SHA-512.
      NDR_BUS_SASL_MECHANISM: ${CERNITY_BUS_CENTRAL_MECHANISM-SCRAM-SHA-512}
      NDR_BUS_SASL_USER: ${CERNITY_BUS_USER:-cernity-sensor}
      NDR_BUS_SASL_PASSWORD: ${CERNITY_BUS_PASSWORD:-}
    volumes:
      - ../../tools/eve-feeder:/feeder:ro
      - cernity-bench-eve:/eve:ro
    depends_on:
      redpanda: {condition: service_healthy}
    restart: "no"
    logging: *cernity-logging

  # Arm B sink: point the central findings-forwarder (from the include) at THIS
  # OpenSearch so Arm B lands in arm-b-findings-* — no manual .env needed (U9).
  # Compose merges these env keys over the central service's defaults.
  findings-forwarder:
    environment:
      CERNITY_SINK: opensearch
      ES_ENDPOINT: http://opensearch:9200
      ES_INDEX_PREFIX: arm-b-findings

volumes:
  cernity-bench-eve: {}
  cernity-bench-zeek: {}
