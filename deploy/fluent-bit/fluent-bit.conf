# Cernity edge shipper. Tails Suricata's split EVE files and does two things: (1) routes
# each event to its Cernity topic, keys by source IP, and ships to the bus; (2) archives the
# raw NSM stream to the central object store (analytics plane only — never the SIEM). Runs on
# the sensor. The bus address comes from REDPANDA_BOOTSTRAP (default redpanda:9092).
[SERVICE]
    Flush          1
    Daemon         Off
    Log_Level      ${LOG_LEVEL}
    Parsers_File   parsers.conf

# Signature alerts (Suricata's eve-alerts.json).
[INPUT]
    Name           tail
    Alias          eve_alerts
    Path           ${SURICATA_EVE_ALERTS}
    Parser         eve_json
    Tag            suricata.alerts
    Read_from_Head false
    DB             /var/lib/cernity/fluent-bit-alerts.db

# Network-security-monitoring records (flow, dns, tls, http, ssh, file, anomaly).
[INPUT]
    Name           tail
    Alias          eve_nsm
    Path           ${SURICATA_EVE_NSM}
    Parser         eve_json
    Tag            suricata.nsm
    Read_from_Head false
    DB             /var/lib/cernity/fluent-bit-nsm.db

# Compute topic + partition key from the record.
[FILTER]
    Name   lua
    Match  suricata.*
    script route.lua
    call   route

# Ship to the bus. Dynamic_topic uses the per-record _topic; the key is _pkey.
[OUTPUT]
    Name              kafka
    Match             suricata.*
    Brokers           ${REDPANDA_BOOTSTRAP}
    Topic_Key         _topic
    Dynamic_topic     On
    Topics            suricata.raw.v1
    Message_Key_Field _pkey
    Timestamp_Key     @timestamp
    rdkafka.compression.codec lz4
    rdkafka.log.connection.close false
    # Secure bus (default): authenticate to the external listener with SASL/SCRAM-SHA-512
    # over TLS. Creds + CA come from the sensor env (see deploy/sensor + deploy/security).
    # For an insecure-demo bus (central started with CERNITY_INSECURE_BUS=1) delete these
    # five lines so the shipper connects plaintext.
    rdkafka.security.protocol SASL_SSL
    rdkafka.sasl.mechanism    SCRAM-SHA-512
    rdkafka.sasl.username     ${CERNITY_BUS_USER}
    rdkafka.sasl.password     ${CERNITY_BUS_PASSWORD}
    rdkafka.ssl.ca.location   ${CERNITY_BUS_TLS_CA}

# Raw NSM archive -> central object store (ndr-raw). Analytics/forensic retention plane only;
# it never reaches the SIEM (findings-first). NSM records only (Match suricata.nsm), gzipped and
# date-partitioned; a short TTL is enforced by the bucket lifecycle. S3/MinIO credentials come
# from the env as a least-privilege key scoped to PutObject on the archive bucket (AWS_ACCESS_KEY_ID
# / AWS_SECRET_ACCESS_KEY) — never the object-store root key. Omit this whole block for a bus-only
# deploy that does not retain a raw-telemetry archive.
[OUTPUT]
    Name             s3
    Match            suricata.nsm
    bucket           ${CERNITY_RAW_BUCKET}
    endpoint         ${CERNITY_RAW_S3_ENDPOINT}
    region           ${CERNITY_RAW_S3_REGION}
    use_put_object   On
    compression      gzip
    s3_key_format    /eve-nsm/date=%Y-%m-%d/$UUID.gz
    total_file_size  50M
    upload_timeout   5m
    store_dir        /var/lib/cernity/s3-buffer
