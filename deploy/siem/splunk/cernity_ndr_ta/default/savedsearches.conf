# Cernity NDR saved searches. Every field filter/split is a CIM name that maps back to a
# siem_pivot.schema.json field (deploy/siem/test_packs.py validates the dashboards that share them).
[Cernity NDR - Findings by signature]
search = `cernity_ndr_findings` | stats count values(risk_object) as risk_object by signature_id, vendor_detector_version
dispatch.earliest_time = -24h
dispatch.latest_time = now

[Cernity NDR - Entity timeline]
search = `cernity_ndr_findings` risk_object="$entity$" | timechart count by signature_id
dispatch.earliest_time = -7d
dispatch.latest_time = now

[Cernity NDR - Evidence for finding]
search = `cernity_ndr_findings` vendor_finding_id="$finding$" | table _time, signature_id, dvc, community_id, vendor_observation_id, vendor_pcap_evidence_id, vendor_file_artifact_id
dispatch.earliest_time = -30d
dispatch.latest_time = now

[Cernity NDR - Incident rollup]
search = `cernity_ndr_findings` vendor_incident_id="$incident$" | stats count values(signature_id) as signatures values(risk_object) as entities by vendor_incident_id
dispatch.earliest_time = -30d
dispatch.latest_time = now
