# Cernity sensor-side bundle: the Fluent Bit shipper that tails Suricata's EVE
# logs and ships them to the central bus. Runs ON the sensor (the box already
# running Suricata). Point it at your Suricata log directory and the bus.
#
#   REDPANDA_BOOTSTRAP=<central-bus-host>:9092 \
#   SURICATA_LOG_DIR=/var/log/suricata \
#   docker compose -f deploy/sensor/docker-compose.yml up -d
#
# Configure Suricata's EVE output first — see docs/suricata-config.md.

x-logging: &cernity-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Tiered container hardening. Cernity's own (python) services drop all caps, gain
# no-new-privileges, and run read-only with a tmpfs /tmp. Infra (redpanda/redis/
# clickhouse/minio/opensearch/etc.) gets no-new-privileges but stays writable.
x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  read_only: true
  tmpfs: ["/tmp"]
x-hardening-infra: &hardening-infra
  security_opt: ["no-new-privileges:true"]

services:
  fluent-bit:
    image: fluent/fluent-bit:latest
    container_name: cernity-fluent-bit
    <<: *hardening-infra
    environment:
      # B-U9/R14: the router stamps tenant/sensor from THESE env vars; they were not passed into the
      # container, so route.lua fell back to default/sensor-1 even when the operator set them. Sourced
      # from the SAME ${NDR_TENANT}/${NDR_SENSOR} the capture-agent uses, so telemetry and capture carry
      # ONE consistent identity.
      NDR_TENANT: ${NDR_TENANT:-default}
      NDR_SENSOR: ${NDR_SENSOR:-sensor-1}
      REDPANDA_BOOTSTRAP: ${REDPANDA_BOOTSTRAP:-redpanda:9092}
      SURICATA_EVE_ALERTS: ${SURICATA_EVE_ALERTS:-/var/log/suricata/eve-alerts.json}
      SURICATA_EVE_NSM: ${SURICATA_EVE_NSM:-/var/log/suricata/eve-nsm.json}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Secure bus creds (default). Copy the central host's ca.crt to this host and
      # point CERNITY_BUS_CA at it. For an insecure-demo bus, remove the SASL lines
      # from deploy/fluent-bit/fluent-bit.conf instead.
      CERNITY_BUS_USER: ${CERNITY_BUS_USER:-cernity-sensor}
      CERNITY_BUS_PASSWORD: ${CERNITY_BUS_PASSWORD:-}
      CERNITY_BUS_TLS_CA: /certs/ca.crt
      # Raw-NSM archive sink (analytics plane). The S3 output in fluent-bit.conf writes the NSM
      # stream to CERNITY_RAW_BUCKET at CERNITY_RAW_S3_ENDPOINT with a least-privilege object-store
      # key (AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY scoped to PutObject on the bucket, NOT root).
      # Leave the endpoint empty and omit the S3 block from fluent-bit.conf for a bus-only deploy.
      CERNITY_RAW_BUCKET: ${CERNITY_RAW_BUCKET:-ndr-raw}
      CERNITY_RAW_S3_ENDPOINT: ${CERNITY_RAW_S3_ENDPOINT:-}
      CERNITY_RAW_S3_REGION: ${CERNITY_RAW_S3_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${CERNITY_RAW_S3_USER:-}
      AWS_SECRET_ACCESS_KEY: ${CERNITY_RAW_S3_PASSWORD:-}
    volumes:
      # the shipper config
      - ../fluent-bit:/fluent-bit/etc:ro
      # the CA that signed the bus's server cert (copied from the central host)
      - ${CERNITY_BUS_CA:-./ca.crt}:/certs/ca.crt:ro
      # your Suricata log directory (read-only)
      - ${SURICATA_LOG_DIR:-/var/log/suricata}:/var/log/suricata:ro
      # shipper offset state, so a restart resumes where it left off
      - cernity-fluentbit-state:/var/lib/cernity
    command: ["/fluent-bit/bin/fluent-bit", "-c", "/fluent-bit/etc/fluent-bit.conf"]
    logging: *cernity-logging
    restart: unless-stopped

  # Mandatory heartbeat, independent of the capture profile. Linux host networking
  # reaches chronyd's localhost-only read-only monitoring endpoint (UDP 323).
  sensor-agent:
    image: cernity/sensor-agent:latest
    build: {context: ../.., dockerfile: services/sensor-agent/Dockerfile}
    <<: *hardening
    network_mode: host
    environment:
      NDR_SENSOR_UUID: ${NDR_SENSOR_UUID:-}
      NDR_TENANT: ${NDR_TENANT:-default}
      NDR_SITE: ${NDR_SITE:-}
      SENSOR_HEARTBEAT_SECONDS: ${SENSOR_HEARTBEAT_SECONDS:-30}
      SENSOR_VERSIONS: ${SENSOR_VERSIONS:-{}}
      REDPANDA_BOOTSTRAP: ${REDPANDA_BOOTSTRAP:-localhost:19092}
      NDR_BUS_SASL_MECHANISM: ${NDR_BUS_SASL_MECHANISM-SCRAM-SHA-512}
      NDR_BUS_SASL_USER: ${CERNITY_BUS_USER:-cernity-sensor}
      NDR_BUS_SASL_PASSWORD: ${CERNITY_BUS_PASSWORD:-}
      NDR_BUS_TLS_CA: /certs/ca.crt
      HOST_PROC: /host/proc
      SENSOR_DISK_PATH: /var/log/suricata
      SENSOR_EVE_PATHS: ${SENSOR_EVE_PATHS:-/var/log/suricata/eve-alerts.json,/var/log/suricata/eve-nsm.json}
      SENSOR_METRICS_PATH: /var/log/suricata/sensor-metrics.json
    volumes:
      - /proc:/host/proc:ro
      - ${SURICATA_LOG_DIR:-/var/log/suricata}:/var/log/suricata:ro
      - ${CERNITY_BUS_CA:-./ca.crt}:/certs/ca.crt:ro
    logging: *cernity-logging
    restart: unless-stopped

  # Optional: on-demand packet forensics. Enable with `--profile capture`.
  # Self-arms over the bus (no inbound access), actuates the local Suricata's
  # conditional PCAP, and ships bounded PCAPs to the central object store.
  capture-agent:
    image: cernity/capture-agent:latest
    build: {context: ../.., dockerfile: services/capture-agent/Dockerfile}
    container_name: cernity-capture-agent
    <<: *hardening
    profiles: [capture]
    environment:
      REDPANDA_BOOTSTRAP: ${REDPANDA_BOOTSTRAP:-redpanda:9092}
      SENSOR_ID: ${NDR_SENSOR:-sensor-1}
      # Authenticated bus (F11): the agent reaches the CENTRAL external listener
      # (SASL/SCRAM over TLS) with the SAME produce-only sensor credential as the
      # shipper — never a superuser. Set NDR_BUS_SASL_MECHANISM= (empty) for a
      # plaintext demo bus.
      NDR_BUS_SASL_MECHANISM: ${NDR_BUS_SASL_MECHANISM-SCRAM-SHA-512}
      NDR_BUS_SASL_USER: ${CERNITY_BUS_USER:-cernity-sensor}
      NDR_BUS_SASL_PASSWORD: ${CERNITY_BUS_PASSWORD:-}
      NDR_BUS_TLS_CA: /certs/ca.crt
      SURICATA_SOCKET: /var/run/suricata/suricata-command.socket
      PCAP_DIR: /var/log/suricata/ndr-capture
      RING_DIR: /var/log/suricata/ndr-ring
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      # Least-privilege object-store credential (F11): a MinIO key scoped to
      # PutObject on ndr-pcap/ndr-files only — NOT the MinIO root key. Create it on
      # the central MinIO first (see docs/getting-started.md); the demo default is
      # unprivileged-in-name-only and must be replaced for production.
      AWS_ACCESS_KEY_ID: ${CERNITY_MINIO_CAPTURE_USER:-cernity}
      AWS_SECRET_ACCESS_KEY: ${CERNITY_MINIO_CAPTURE_PASSWORD:-cernitydemo}
      PCAP_BUCKET: ndr-pcap
      FILES_BUCKET: ndr-files
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # the CA that signed the bus's server cert (copied from the central host)
      - ${CERNITY_BUS_CA:-./ca.crt}:/certs/ca.crt:ro
      # Suricata's command socket + pcap output dir (read-write for capture)
      - ${SURICATA_RUN_DIR:-/var/run/suricata}:/var/run/suricata
      - ${SURICATA_LOG_DIR:-/var/log/suricata}:/var/log/suricata
    logging: *cernity-logging
    restart: unless-stopped

volumes:
  cernity-fluentbit-state: {}
