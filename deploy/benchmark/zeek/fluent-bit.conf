# Arm C (reference): Zeek notice.log -> OpenSearch (index arm-c-zeek). Zeek notices are
# the fair "what the engine flagged" analog to Suricata alerts / Cernity findings. Zeek
# writes JSON (LogAscii::use_json=T), so we tail notice.log and remap its src/dst to the
# src_ip/dest_ip the scorer's flagged_from_alerts() reads. A pcap that yields zero notices
# leaves this index empty on purpose — a valid reference result, not a run failure
# (run.py treats arm-c as empty-tolerant).
[SERVICE]
    Flush        1
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name   tail
    Path   /zeek-logs/notice.log
    Tag    arm_c.notice
    Parser json
    Read_from_Head true

# Zeek notice fields -> scorer's expected host keys.
[FILTER]
    Name   modify
    Match  arm_c.*
    Rename src src_ip
    Rename dst dest_ip

[OUTPUT]
    Name    opensearch
    Match   arm_c.*
    Host    opensearch
    Port    9200
    Index   arm-c-zeek
    Suppress_Type_Name On
    tls     Off
