# CIM field aliases for Cernity NDR findings (sourcetype cernity:ndr:finding).
#
# The findings-forwarder emits CIM names directly (services/findings-forwarder/mappings.py:to_cim),
# but these aliases also normalize a raw export carrying the canonical siem_pivot names
# (contracts/siem_pivot.schema.json) into the same CIM fields, so dashboards key on one stable set.
# RHS of every alias is the CIM field name and MUST match CIM_MAP in mappings.py — deploy/siem/
# test_packs.py enforces that. Independently authored from the public Splunk CIM (§26).
[cernity:ndr:finding]
KV_MODE = json
FIELDALIAS-signature_id       = signature_id AS signature_id
FIELDALIAS-vendor_finding_id  = finding_id AS vendor_finding_id
FIELDALIAS-revision           = revision AS vendor_finding_revision
FIELDALIAS-incident_id        = incident_id AS vendor_incident_id
FIELDALIAS-risk_object        = entity_id AS risk_object
FIELDALIAS-asset_id           = asset_key AS asset_id
FIELDALIAS-community_id       = community_id AS community_id
FIELDALIAS-dvc                = observation_point AS dvc
FIELDALIAS-observation_id     = observation_id AS vendor_observation_id
FIELDALIAS-pcap_evidence_id   = pcap_evidence_id AS vendor_pcap_evidence_id
FIELDALIAS-file_artifact_id   = file_artifact_id AS vendor_file_artifact_id
FIELDALIAS-investigation_id   = investigation_id AS vendor_investigation_id
FIELDALIAS-model_version      = model_version AS vendor_model_version
FIELDALIAS-detector_version   = detector_version AS vendor_detector_version
